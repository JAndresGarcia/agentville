name: Feature request
description: An idea that would make Agentville better for you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Agentville to do? A sketch or a screenshot is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to build this myself (see CONTRIBUTING.md).
